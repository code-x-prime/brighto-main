# ==========================================
# 1. HTTP ONLY CONFIGURATION (For initial setup & Certbot verification)
# ==========================================
# Copy this block to /etc/nginx/sites-available/brightoindia.com
# Then run: sudo certbot --nginx -d brightoindia.com -d www.brightoindia.com

server {
    listen 80;
    server_name brightoindia.com www.brightoindia.com;

    location / {
        proxy_pass http://127.0.0.1:7006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


